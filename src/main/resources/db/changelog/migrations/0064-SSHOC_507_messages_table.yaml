databaseChangeLog:
  - changeSet:
      id: 0063-messages_table
      author: woz
      comment: New table `messages`
      changes:
        - createTable:
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_messages
              - column:
                  name: recipient_id
                  type: BIGINT
              - column:
                  name: content
                  type: VARCHAR(255)
              - column:
                  name: is_read
                  type: boolean
            tableName: messages
        - createSequence:
            sequenceName: message_id_seq
            startValue: 1
            incrementBy: 1